name: Architecture as Truth

# A code repository in a team with one decisions repository. It holds the
# code, and the contracts and behaviours that are tested against it. This
# workflow enforces on every pull request:
#   rule 2, build what was approved: a build does not edit an approved
#           contract or the wording of a scenario (a declared amendment,
#           labelled `amendment` by a person, may).
# Rule 4, leave the truth true, is checked where the records live: the
# decisions repository refuses a change that adds no record, and the record
# names this repository's pull requests by URL. The other two rules, read
# before writing and stop, do not patch, are asked of the agent in AGENTS.md;
# its record is what shows whether it kept them.
#
# The checks come from the Architecture as Truth repository at a tagged
# release: https://github.com/puglieseweb/architecture-as-truth

on:
  pull_request:

permissions:
  contents: read

jobs:
  truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Fetch the checks
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: puglieseweb/architecture-as-truth
          ref: v1.0.0
          path: .aat

      - name: "Rule 2: a build does not edit approved truth"
        env:
          AMENDMENT: ${{ contains(github.event.pull_request.labels.*.name, 'amendment') && '--amendment' || '' }}
          BASE: ${{ github.base_ref }}
        run: python3 .aat/checks/approved_guard.py --base "origin/$BASE" --head HEAD $AMENDMENT
